# PPC64LE (ELFv2, little-endian) cross build + qemu-user E2E.
# See TODO.impl/20-riscv-ppc.md.
#
# Kept separate from build.yml because:
#   - Cross toolchain (gcc-powerpc64le-linux-gnu), not a native runner.
#   - The E2E runs ppc64le binaries under qemu-user with the preload
#     library -- a lane no other workflow exercises.
#   - The link keeps --hash-style=sysv + the ppc64.ver script (the
#     binutils-2.42 GNU-hash bloom defect and the unversioned-export
#     loader law; both wired by CMake for the ppc64 arch).

name: PPC64LE

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  CROSS: powerpc64le-linux-gnu
  QEMU: qemu-ppc64le-static

jobs:
  e2e:
    name: cross-build + qemu-user E2E
    # ARM runner, not x64 (the TODO.impl/19 law): qemu-user on
    # the x86_64 TCG backend mis-emulates the guest exit path.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-${CROSS} cmake ninja-build qemu-user-static file python3

      - name: Configure + build libretrace.so
        run: |
          cat > toolchain.cmake <<EOT
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ppc64le)
          set(CMAKE_C_COMPILER ${CROSS}-gcc)
          set(CMAKE_CXX_COMPILER ${CROSS}-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/${CROSS})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOT
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DRETRACE_BUILD_TESTS=OFF \
            -DRETRACE_BUILD_CLI=OFF \
            -DRETRACE_BUILD_EXAMPLES=OFF
          cmake --build build --target retrace_v2
          ${CROSS}-readelf -h build/src/v2/libretrace.so > elf.info
          grep -q "ELF64" elf.info
          grep -q "little endian" elf.info
          grep -q "PowerPC64" elf.info
          # the sysv-hash keeper must be in the final link
          ${CROSS}-readelf -d build/src/v2/libretrace.so | grep -q HASH

      - name: Trampoline alignment invariant
        # ELFv2: every function entry is 16-byte aligned and each
        # trampoline advertises a local entry. A misaligned entry
        # lands same-TOC callers mid-instruction (the round-16
        # finding: 324/780 FUNC dynsyms at 8-mod-16).
        run: |
          python3 - <<EOT
          import subprocess
          out = subprocess.check_output([
              "${CROSS}-readelf", "--dyn-syms", "-W",
              "build/src/v2/libretrace.so"], text=True)
          funcs = []
          for l in out.splitlines():
              parts = l.split()
              if len(parts) > 3 and parts[3] == "FUNC":
                  funcs.append((parts[1], l))
          bad = [l for v, l in funcs if int(v, 16) % 16 != 0]
          print(f"exported FUNC dynsyms: {len(funcs)}, misaligned: {len(bad)}")
          assert len(funcs) > 300, "trampolines missing from dynsym"
          assert not bad, "misaligned FUNC values:\n" + "\n".join(bad[:10])
          EOT

      - name: E2E - log_params + call_real under qemu
        run: |
          cat > probe.c <<EOT
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          int main(void)
          {
                  const char *path = getenv("RETRACE_PROBE_STR");
                  char buf[64];
                  int fd;
                  memset(buf, 0, sizeof(buf));
                  snprintf(buf, sizeof(buf), "len=%zu",
                          strlen(path ? path : "none"));
                  fd = open("/etc/hosts", O_RDONLY);
                  if (fd >= 0) {
                          char r[16];
                          ssize_t n = read(fd, r, sizeof(r));
                          close(fd);
                          printf("fd=%d n=%zd\n", fd, n);
                  }
                  free(malloc(128));
                  printf("%s\n", buf);
                  return 0;
          }
          EOT
          ${CROSS}-gcc -O1 -o probe probe.c

          cat > conf.json <<EOT
          {"intercept_scripts": [
            {"func_name": "*",
             "actions": [
               {"action_name": "log_params"},
               {"action_name": "call_real"}]}]}
          EOT

          export RETRACE_PROBE_STR=abcd
          export RETRACE_JSON_CONFIG="$PWD/conf.json"
          export RETRACE_LOGGER_DEF_ENA=1
          export RETRACE_LOGGER_DEF_FN="$PWD/trace.log"
          export LD_PRELOAD="$PWD/build/src/v2/libretrace.so"

          out="$(${QEMU} -L /usr/${CROSS} ./probe 2>probe.err)"
          rc=$?
          unset LD_PRELOAD
          echo "probe rc=$rc"
          cat probe.err
          echo "$out"
          # the probe's own stdio output is flush-racy under
          # interposition -- the JSON trace is the deterministic
          # record, and it carries everything asserted here.
          [ "$rc" -eq 0 ]
          echo "$out" | grep -qF '"func": "open"'
          # parson escapes forward slashes on the wire: the
          # trace renders \/etc\/hosts
          echo "$out" | grep -qF '\/etc\/hosts'
          echo "$out" | grep -qF '"func": "read"'
          echo "$out" | grep -qF '"len=4"'

      - name: E2E - policy denial enforced under qemu
        run: |
          cat > deny.json <<EOT
          {"intercept_scripts": [
            {"func_name": "open",
             "actions": [
               {"action_name": "log_params"},
               {"action_name": "modify_return_value_int",
                "action_params": {"retval_int": -13}}]}]}
          EOT

          export RETRACE_JSON_CONFIG="$PWD/deny.json"
          export RETRACE_LOGGER_DEF_ENA=1
          export RETRACE_LOGGER_DEF_FN="$PWD/deny.log"
          export LD_PRELOAD="$PWD/build/src/v2/libretrace.so"

          out="$(${QEMU} -L /usr/${CROSS} ./probe 2>probe.err)"
          rc=$?
          unset LD_PRELOAD
          echo "probe rc=$rc"
          cat probe.err
          echo "$out"
          # the deny script has no call_real: open() must never
          # reach it, and modify_return_value_int must run.
          [ "$rc" -eq 0 ]
          echo "$out" | grep -qF '"func": "open"'
          echo "$out" | grep -qF 'modify_return_value_int'
          if echo "$out" | grep -qF 'Running action call_real, for open'; then
                  echo "ERROR: open was not denied" >&2
                  exit 1
          fi
