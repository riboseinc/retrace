# Release pipeline for retrace.
#
# Produces, per tag push:
#   - retrace-<version>.tar.gz             (source)
#   - retrace-<version>-<platform>.tar.gz  (binary, POSIX)
#   - retrace-<version>-<platform>.zip     (binary, Windows)
#
# Binary platforms:
#   linux-x86_64, linux-aarch64
#   macos-arm64                     (macos-x86_64 disabled pending #452)
#   windows-x64, windows-arm64
#   alpine-x86_64, alpine-aarch64
#   ohos-aarch64                   (cross-compiled; self-signed for OHOS load)
#
# Each binary archive ships the shared library, public headers, LICENSE,
# README, and a THIRD_PARTY_NOTICES confirming no MinHook/Detours linkage
# (per ADR-0009).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # Source tarball -- single job, runs on Linux.
  # ---------------------------------------------------------------
  source-tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Build source tarball
        run: ./scripts/build-release-tarball.sh "$RUNNER_TEMP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: |
            ${{ runner.temp }}/retrace-*.tar.gz
            ${{ runner.temp }}/retrace-*.tar.gz.sha256

  # ---------------------------------------------------------------
  # Binary artifacts -- matrix across (OS, arch).
  # ---------------------------------------------------------------
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            os: linux
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            os: linux
          - platform: macos-arm64
            runner: macos-14
            os: macos
          # macos-x86_64 disabled until #452 is fixed.
          - platform: windows-x64
            runner: windows-2022
            os: windows
          - platform: windows-arm64
            runner: windows-11-arm
            os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ----- POSIX (Linux, macOS) -----
      - name: Install deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libssl-dev

      - name: Install deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install cmake ninja openssl

      - name: Configure & build (POSIX)
        if: matrix.os != 'windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage binary (Linux)
        if: matrix.os == 'linux'
        run: |
          VERSION="$(awk -F\" '/^#define RETRACE_VERSION_STRING/ {print $2}' include/retrace/version.h)"
          STAGE="retrace-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          cp build/src/v2/libretrace.so* "$STAGE/lib/"
          cp -r include/retrace/* "$STAGE/include/"
          cp LICENSE.md README.adoc "$STAGE/"
          cp .github/notice/THIRD_PARTY_NOTICES.posix-with-windows "$STAGE/THIRD_PARTY_NOTICES"
          tar -czf "retrace-${VERSION}-${{ matrix.platform }}.tar.gz" "$STAGE"
          sha256sum "retrace-${VERSION}-${{ matrix.platform }}.tar.gz" \
            > "retrace-${VERSION}-${{ matrix.platform }}.tar.gz.sha256"

      - name: Stage binary (macOS)
        if: matrix.os == 'macos'
        run: |
          VERSION="$(awk -F\" '/^#define RETRACE_VERSION_STRING/ {print $2}' include/retrace/version.h)"
          STAGE="retrace-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          cp build/src/v2/libretrace.*.dylib "$STAGE/lib/"
          cp -r include/retrace/* "$STAGE/include/"
          cp LICENSE.md README.adoc "$STAGE/"
          cp .github/notice/THIRD_PARTY_NOTICES.posix "$STAGE/THIRD_PARTY_NOTICES"
          tar -czf "retrace-${VERSION}-${{ matrix.platform }}.tar.gz" "$STAGE"
          shasum -a 256 "retrace-${VERSION}-${{ matrix.platform }}.tar.gz" \
            > "retrace-${VERSION}-${{ matrix.platform }}.tar.gz.sha256"

      # ----- Windows (MSVC) -----
      - name: Set up vcpkg (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'windows-arm64') {
            $triplet = 'arm64-windows'
          } else {
            $triplet = 'x64-windows'
          }
          if (-not (Test-Path vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          }
          cd vcpkg
          if (-not (Test-Path vcpkg.exe)) { .\bootstrap-vcpkg.bat -disableMetrics }
          "VCPKG_TRIPLET=$triplet" | Out-File -Append $env:GITHUB_ENV

      - name: Configure & build (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $toolchain = "${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"
          cmake -B build "-DCMAKE_BUILD_TYPE=Release" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          cmake --build build --config Release

      - name: Stage binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path include/retrace/version.h `
            -Pattern '#define RETRACE_VERSION_STRING "([^"]+)"').Matches.Groups[1].Value
          $stage = "retrace-$version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "$stage/bin", "$stage/include"
          $msvcDll = "build/src/backends/preload_msvc/Release/retrace_backend_preload_msvc.dll"
          if (Test-Path $msvcDll) { Copy-Item $msvcDll "$stage/bin/" }
          $mingwDll = "build/src/backends/preload_mingw/Release/retrace_backend_preload_mingw.dll"
          if (Test-Path $mingwDll) { Copy-Item $mingwDll "$stage/bin/" }
          Copy-Item -Recurse include/retrace/* "$stage/include/"
          Copy-Item LICENSE.md, README.adoc "$stage/"
          @"
          retrace third-party notices
          ===========================

          retrace is BSD-2-Clause licensed.

          This build does NOT link against or include:
            - MinHook (https://github.com/TsudaKageyu/minhook)
            - Microsoft Detours (https://github.com/microsoft/Detours)

          The Windows inline-hooking backends (src/backends/win_common/) are
          implemented from scratch per ADR-0009. The JSON parser (parson) is
          vendored under src/config/json/parson.{c,h} and retains its MIT
          license header in those files.
          "@ | Out-File -Encoding ascii "$stage/THIRD_PARTY_NOTICES"
          Compress-Archive -Path $stage -DestinationPath "retrace-$version-${{ matrix.platform }}.zip"
          $hash = (Get-FileHash "retrace-$version-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash
          "$hash *retrace-$version-${{ matrix.platform }}.zip" | Out-File -Encoding ascii "retrace-$version-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            retrace-*.tar.gz
            retrace-*.tar.gz.sha256
            retrace-*.zip
            retrace-*.zip.sha256

  # ---------------------------------------------------------------
  # Alpine (musl) binaries -- container-based, runs on Linux x86_64
  # with QEMU for aarch64.
  # ---------------------------------------------------------------
  alpine-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: alpine-x86_64
            arch: amd64
          - platform: alpine-aarch64
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD:/work" -w /work alpine:latest \
            sh -c '
              set -eu
              apk add --no-cache cmake ninja gcc musl-dev linux-headers openssl-dev
              cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build
              VERSION=$(awk -F"\"" "/^#define RETRACE_VERSION_STRING/ {print \$2}" include/retrace/version.h)
              STAGE="retrace-${VERSION}-${{ matrix.platform }}"
              mkdir -p "$STAGE/lib" "$STAGE/include"
              cp build/src/v2/libretrace.so* "$STAGE/lib/"
              cp -r include/retrace/* "$STAGE/include/"
              cp LICENSE.md README.adoc "$STAGE/"
              cp .github/notice/THIRD_PARTY_NOTICES.musl "$STAGE/THIRD_PARTY_NOTICES"
              tar -czf "retrace-${VERSION}-${{ matrix.platform }}.tar.gz" "$STAGE"
              sha256sum "retrace-${VERSION}-${{ matrix.platform }}.tar.gz" \
                > "retrace-${VERSION}-${{ matrix.platform }}.tar.gz.sha256"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            retrace-*.tar.gz
            retrace-*.tar.gz.sha256

  # ---------------------------------------------------------------
  # OHOS (OpenHarmony) aarch64 binary -- cross-compiled from Linux
  # x86_64 via the official OHOS NDK + LLVM-19 toolchain. The .so is
  # self-signed with binary-sign-tool so OHOS will load it at runtime.
  # ---------------------------------------------------------------
  ohos-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build curl jq unzip file ca-certificates

      - name: Cache OHOS NDK (~4 GB)
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/ohos
          key: ohos-ndk-${{ hashFiles('.github/scripts/setup-ohos-ndk.sh') }}

      - name: Setup OHOS NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: ./.github/scripts/setup-ohos-ndk.sh --prefix /opt/ohos

      - name: Cross-compile retrace
        run: |
          cmake -S . -B build-ohos \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ohos/ohos-sdk/linux/native/build/cmake/ohos.toolchain.cmake \
            -DOHOS_ARCH=arm64-v8a -DOHOS_PLATFORM=OHOS \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DRETRACE_BUILD_SHARED=ON \
            -DRETRACE_BUILD_STATIC=OFF \
            -DRETRACE_BUILD_V2=ON \
            -DRETRACE_BUILD_CLI=OFF \
            -DRETRACE_BUILD_TESTS=OFF \
            -G Ninja
          cmake --build build-ohos -j"$(nproc)"

      - name: Verify .so is ARM aarch64
        run: |
          file build-ohos/src/v2/libretrace.so.2.1.0 | tee /dev/stderr \
            | grep -q 'ELF 64-bit LSB .* ARM aarch64'

      - name: Code-sign .so (required by OHOS at dlopen time)
        run: |
          for f in build-ohos/src/v2/libretrace.so \
                   build-ohos/src/v2/libretrace.so.2 \
                   build-ohos/src/v2/libretrace.so.2.1.0; do
            [ -e "$f" ] || continue
            /opt/ohos/ohos-sdk/linux/toolchains/lib/binary-sign-tool sign \
              -selfSign 1 -inFile "$f" -outFile "$f"
          done

      - name: Stage binary
        run: |
          VERSION="$(awk -F\" '/^#define RETRACE_VERSION_STRING/ {print $2}' include/retrace/version.h)"
          STAGE="retrace-${VERSION}-ohos-aarch64"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          cp build-ohos/src/v2/libretrace.so* "$STAGE/lib/"
          cp -r include/retrace/* "$STAGE/include/"
          cp LICENSE.md README.adoc "$STAGE/"
          cp .github/notice/THIRD_PARTY_NOTICES.ohos "$STAGE/THIRD_PARTY_NOTICES"
          tar -czf "retrace-${VERSION}-ohos-aarch64.tar.gz" "$STAGE"
          sha256sum "retrace-${VERSION}-ohos-aarch64.tar.gz" \
            > "retrace-${VERSION}-ohos-aarch64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-ohos-aarch64
          path: |
            retrace-*.tar.gz
            retrace-*.tar.gz.sha256

  # ---------------------------------------------------------------
  # Publish: gather all artifacts, attach to GitHub Release.
  # ---------------------------------------------------------------
  publish:
    needs: [source-tarball, binary, alpine-binary, ohos-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            ref="${{ inputs.ref }}"
          else
            ref="${GITHUB_REF#refs/tags/}"
          fi
          ref="${ref#refs/tags/}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/retrace-*.tar.gz
            artifacts/retrace-*.tar.gz.sha256
            artifacts/retrace-*.zip
            artifacts/retrace-*.zip.sha256
