name: debug-arm-policy (temporary)
# Temporary diagnostics: ASAN build of the policy E2E on arm64.
# Delete before merge.
on:
  push:
    branches: [supervisor/05-policy]

jobs:
  asan-policy-e2e:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc libcmocka-dev \
            python3 gdb
      - name: build (CI-identical: Release + ubuntu default fortify)
        run: |
          cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON \
            -DRETRACE_BUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: run the policy E2E (reproduce the abort)
        run: |
          python3 test/integration/test_supervisor_policy.py \
            build/tools/retraced/retraced \
            build/src/v2/libretrace.so \
            build/test/policy_target || true
      - name: run it again with core dumps + backtrace
        if: always()
        run: |
          ulimit -c unlimited
          cd $(mktemp -d) && echo "core.%p" > proc_sys.txt || true
          sudo sysctl -w kernel.core_pattern='core.%p' || true
          cd $GITHUB_WORKSPACE
          python3 test/integration/test_supervisor_policy.py \
            build/tools/retraced/retraced \
            build/src/v2/libretrace.so \
            build/test/policy_target || true
          for c in core.*; do
            [ -f "$c" ] && gdb -batch -ex "bt 25" \
              build/test/policy_target "$c" 2>/dev/null || true
          done
