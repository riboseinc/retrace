# MSys2 / MinGW-w64 build. Two environments in matrix: mingw64 and ucrt64.
# See TODO.roadmap/09-ci-cd-modernization.md.
#
# Kept separate from build.yml because:
#   - Different shell (msys2 {0}, not pwsh or bash).
#   - Different toolchain (gcc, not MSVC).
#   - vcpkg mingw-static triplet, not the windows triplet.

name: MSYS

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  MAKEFLAGS: -j4
  VCPKG_REF: 4f95fba7a7d1101bb8acdeb51e4609686449701e

jobs:
  build-and-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        sys: [ mingw64, ucrt64 ]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup msys
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          msystem: ${{ matrix.sys }}
          update: false
          install: git flex bison gettext-devel
          pacboy: cmake:p python3:p ninja:p curl:p pkgconf:p gcc:p openssl:p

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure cache
        run: |
          printf 'VCPKG_DEFAULT_BINARY_CACHE<<EOF\n%s\nEOF\n' "$(pwd)/cache" >> "$GITHUB_ENV"
          printf 'CI_CACHE<<EOF\n%s\nEOF\n'                   "$(pwd -W)/cache" >> "$GITHUB_ENV"

      - name: Create cache storage
        run: mkdir "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CI_CACHE }}
          key: ${{ github.workflow }}-${{ matrix.sys }}-vcpkg-${{ env.VCPKG_REF }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            cd vcpkg && git checkout "$VCPKG_REF"
            ./bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
                -DCMAKE_TOOLCHAIN_FILE="$(pwd)/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Smoke test
        run: ./build/retrace --help
