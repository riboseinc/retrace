name: macOS Intel debug
on:
  push:
    branches: [ fix/macos-intel-debug ]

jobs:
  intel-debug:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja openssl@3
      - name: Configure
        run: cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Run test/id
        run: |
          set +e
          DYLD_INSERT_LIBRARIES=$PWD/build/src/v2/libretrace.dylib build/test/id > /tmp/out 2> /tmp/err
          rc=$?
          echo "rc=$rc"
          echo "stdout:"; head -3 /tmp/out
          echo "stderr:"; head -3 /tmp/err
      - name: Run test/printf
        run: |
          set +e
          DYLD_INSERT_LIBRARIES=$PWD/build/src/v2/libretrace.dylib build/test/printf > /tmp/out 2> /tmp/err
          rc=$?
          echo "rc=$rc"
          echo "stdout:"; head -10 /tmp/out
          echo "stderr:"; head -3 /tmp/err
