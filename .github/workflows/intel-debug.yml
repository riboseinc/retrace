name: macOS Intel debug
on:
  push:
    branches: [ fix/macos-intel-debug ]

jobs:
  intel-debug:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja openssl@3
      - name: Configure
        run: cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Run test/printf under lldb to get crash backtrace
        run: |
          cat > /tmp/lldb.txt <<'LLDB'
          settings set target.env-vars DYLD_INSERT_LIBRARIES=/Users/runner/work/retrace/retrace/build/src/v2/libretrace.dylib
          process launch
          bt
          bt all
          register read
          LLDB
          lldb --batch -s /tmp/lldb.txt build/test/printf 2>&1 | tail -100 || true
      - name: Run test/id (simpler) under lldb
        run: |
          cat > /tmp/lldb2.txt <<'LLDB'
          settings set target.env-vars DYLD_INSERT_LIBRARIES=/Users/runner/work/retrace/retrace/build/src/v2/libretrace.dylib
          process launch
          bt
          register read
          LLDB
          lldb --batch -s /tmp/lldb2.txt build/test/id 2>&1 | tail -60 || true
      - name: Disassemble printf_retrace_wrapper
        run: |
          echo "=== symbols in libretrace.dylib ==="
          nm -m build/src/v2/libretrace.dylib 2>&1 | grep -E "printf|__retrace_rimpls|___interpose|interpose" | head -30
          echo "=== printf_retrace_wrapper via gdb-style disasm ==="
          lldb --batch -o "image lookup -s _printf_retrace_wrapper" -o "quit" build/src/v2/libretrace.dylib 2>&1 | tail -10
      - name: Test without retrace (baseline)
        run: |
          echo "=== baseline test/printf ==="
          build/test/printf 2>&1 | head -10
          echo "rc=$?"
          echo "=== baseline test/id ==="
          build/test/id
          echo "rc=$?"
