name: macOS Intel debug
on:
  push:
    branches: [ fix/macos-intel-debug ]

jobs:
  intel-debug:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja openssl@3
      - name: Configure
        run: cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Standalone getsectiondata test
        run: |
          cat > /tmp/cmp.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <mach-o/getsect.h>
          #include <mach-o/dyld.h>
          
          int main(void) {
              // First, just count images
              uint32_t count = _dyld_image_count();
              fprintf(stderr, "image count: %u\n", count);
              
              // Try to find libretrace
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (name) {
                      fprintf(stderr, "  [%u] %s\n", i, name);
                  }
              }
              
              // Now try getsectiondata
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (name && strstr(name, "libretrace")) {
                      fprintf(stderr, "Found libretrace at idx %u: %s\n", i, name);
                      const struct mach_header_64 *hdr = (const struct mach_header_64 *)_dyld_get_image_header(i);
                      unsigned long size = 0;
                      void *addr = getsectiondata(hdr, "__DATA", "__retrace_rimpls", &size);
                      fprintf(stderr, "getsectiondata: addr=%p size=%lu\n", addr, size);
                      break;
                  }
              }
              return 0;
          }
          C
          gcc -o /tmp/cmp /tmp/cmp.c
          echo "=== WITHOUT LD_PRELOAD ==="
          /tmp/cmp 2>&1 | head -20
          echo "=== WITH LD_PRELOAD ==="
          (DYLD_INSERT_LIBRARIES=$PWD/build/src/v2/libretrace.dylib /tmp/cmp 2>&1 | head -20) || echo "rc=$?"
