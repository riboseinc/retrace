name: macOS Intel debug
on:
  push:
    branches: [ fix/macos-intel-debug ]

jobs:
  intel-debug:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja openssl@3
      - name: Configure
        run: cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Run test/id
        run: |
          DYLD_INSERT_LIBRARIES=$PWD/build/src/v2/libretrace.dylib build/test/id
          echo "id rc=$?"
      - name: Run test/printf
        run: |
          DYLD_INSERT_LIBRARIES=$PWD/build/src/v2/libretrace.dylib build/test/printf > /tmp/out 2> /tmp/err
          echo "printf rc=$?"
          echo "stdout:"
          cat /tmp/out | tail -10
          echo "stderr:"
          cat /tmp/err | tail -3
      - name: ctest
        run: |
          cd build
          ctest --output-on-failure 2>&1 | tail -15
