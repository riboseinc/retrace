name: macOS Intel debug
on:
  push:
    branches: [ fix/macos-intel-debug ]

jobs:
  intel-debug:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja openssl@3
      - name: Configure
        run: cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Find retrace_real_impls address and dump memory
        run: |
          cat > /tmp/lldb.txt <<'LLDB'
          settings set target.env-vars DYLD_INSERT_LIBRARIES=/Users/runner/work/retrace/retrace/build/src/v2/libretrace.dylib
          break set -n retrace_logger_deinit
          process launch
          image lookup -s _retrace_real_impls
          image lookup -vs retrace_real_impls
          expr (void*)&retrace_real_impls
          memory read -fA -c8 `(void*)&retrace_real_impls`
          LLDB
          lldb --batch -s /tmp/lldb.txt build/test/printf 2>&1 | tail -40 || true
      - name: Check if init ran
        run: |
          cat > /tmp/lldb2.txt <<'LLDB'
          settings set target.env-vars DYLD_INSERT_LIBRARIES=/Users/runner/work/retrace/retrace/build/src/v2/libretrace.dylib
          break set -n retrace_main
          process launch
          expr retrace_inited
          expr (void*)&retrace_real_impls
          memory read -fA -c8 `(void*)&retrace_real_impls`
          LLDB
          lldb --batch -s /tmp/lldb2.txt build/test/printf 2>&1 | tail -30 || true
      - name: Constructor at multiple breakpoints
        run: |
          cat > /tmp/lldb3.txt <<'LLDB'
          settings set target.env-vars DYLD_INSERT_LIBRARIES=/Users/runner/work/retrace/retrace/build/src/v2/libretrace.dylib
          break set -n retrace_real_impls_init
          process launch
          bt
          expr retrace_real_impls.malloc
          LLDB
          lldb --batch -s /tmp/lldb3.txt build/test/printf 2>&1 | tail -30 || true
