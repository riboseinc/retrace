name: macOS Intel debug
on:
  push:
    branches: [ fix/macos-intel-debug ]

jobs:
  intel-debug:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja openssl@3
      - name: Configure
        run: cmake -B build -G Ninja -DRETRACE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Trace retrace_as_get_real_safe for "dlopen"
        run: |
          cat > /tmp/lldb.txt <<'LLDB'
          settings set target.env-vars DYLD_INSERT_LIBRARIES=/Users/runner/work/retrace/retrace/build/src/v2/libretrace.dylib
          break set -n retrace_as_get_real_safe
          process launch
          bt
          frame variable
          expr real_impl
          expr (char*)real_impl
          continue
          bt
          frame variable
          expr real_impl
          expr (char*)real_impl
          continue
          continue
          continue
          continue
          continue
          LLDB
          lldb --batch -s /tmp/lldb.txt build/test/printf 2>&1 | grep -E "(frame|real_impl=|retrace_as_get|stopped|breakpoint|0x)" | head -60 || true
      - name: Compare section size and content
        run: |
          echo "=== otool -l on libretrace.dylib ==="
          otool -l build/src/v2/libretrace.dylib 2>&1 | grep -B 1 -A 10 "sectname __retrace_rimpls" | head -20
          echo "=== size of __retrace_rimpls in bytes ==="
          otool -l build/src/v2/libretrace.dylib 2>&1 | awk '/sectname __retrace_rimpls/{found=1} found && /size/{print; found=0}'
