# Daily Coverity Scan. See TODO.roadmap/09-ci-cd-modernization.md.

name: Coverity

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  CORES: 2

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: coverity-scan
      url: https://scan.coverity.com/projects/riboseinc-retrace?tab=overview

    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y
                libssl-dev cmake ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRETRACE_BUILD_TESTS=ON

      - name: Calculate Coverity Tool Cache Key (quarterly)
        run: echo "COV_CACHE_KEY=$(date +%Y)-$(echo "($(date +%-m)-1)/3" | bc)" >> "$GITHUB_ENV"

      - name: Cache Coverity Tool
        id: coverity-tool-cache
        uses: actions/cache@v4
        with:
          path: cov-analysis-linux64
          key: cov-analysis-linux64-${{ env.COV_CACHE_KEY }}

      - name: Download Coverity
        if: steps.coverity-tool-cache.outputs.cache-hit != 'true'
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          wget -q https://scan.coverity.com/download/linux64 \
            --post-data "token=$TOKEN&project=$GITHUB_REPOSITORY" \
            -O cov-analysis-linux64.tar.gz
          mkdir cov-analysis-linux64
          tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64

      - name: Build with cov-build
        run: |
          set -x
          export PATH="$PWD/cov-analysis-linux64/bin:$PATH"
          cov-build --dir cov-int cmake --build build

      - name: Submit
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          tar czvf results.tgz cov-int
          curl --fail-with-body \
            --form project=$GITHUB_REPOSITORY \
            --form token=$TOKEN \
            --form email=retrace@ribose.com \
            --form file=@results.tgz \
            --form version="$GITHUB_REF" \
            --form description=$GITHUB_SHA \
            https://scan.coverity.com/builds?project=$GITHUB_REPOSITORY
