# MIPS64 (big-endian, n64) cross build + qemu-user E2E.
# See TODO.impl/19-mips-backend.md.
#
# Kept separate from build.yml because:
#   - Cross toolchain (gcc-mips64-linux-gnuabi64), not a native runner.
#   - The E2E runs big-endian n64 binaries under qemu-user with the
#     preload library -- a lane no other workflow exercises.

name: MIPS64

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  CROSS: mips64-linux-gnuabi64
  QEMU: qemu-mips64-static

jobs:
  e2e:
    name: cross-build + qemu-user E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-${CROSS} cmake ninja-build qemu-user-static file python3

      - name: Configure + build libretrace.so
        run: |
          cat > toolchain.cmake <<EOT
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR mips64)
          set(CMAKE_C_COMPILER ${CROSS}-gcc)
          set(CMAKE_CXX_COMPILER ${CROSS}-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/${CROSS})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOT
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DRETRACE_BUILD_TESTS=OFF \
            -DRETRACE_BUILD_CLI=OFF \
            -DRETRACE_BUILD_EXAMPLES=OFF
          cmake --build build --target retrace_v2
          file build/src/v2/libretrace.so | grep -q "ELF 64-bit MSB"

      - name: Trampoline alignment invariant
        # An odd FUNC dynsym value IS the MIPS microMIPS ISA-mode
        # bit; the runtime switches ISA mode on call and dies. The
        # trampoline macro aligns every entry; this gate keeps it
        # aligned forever.
        run: |
          python3 - <<EOT
          import subprocess
          out = subprocess.check_output([
              "${CROSS}-readelf", "--dyn-syms", "-W",
              "build/src/v2/libretrace.so"], text=True)
          funcs = []
          for l in out.splitlines():
              parts = l.split()
              if len(parts) > 3 and parts[3] == "FUNC":
                  funcs.append((parts[1], l))
          odd = [l for v, l in funcs if int(v, 16) % 2 != 0]
          print(f"exported FUNC dynsyms: {len(funcs)}, odd values: {len(odd)}")
          assert len(funcs) > 300, "trampolines missing from dynsym"
          assert not odd, "odd FUNC values:\n" + "\n".join(odd[:10])
          EOT

      - name: E2E - log_params + call_real under qemu
        run: |
          cat > probe.c <<EOT
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          int main(void)
          {
                  const char *path = getenv("RETRACE_PROBE_STR");
                  char buf[64];
                  int fd;
                  memset(buf, 0, sizeof(buf));
                  snprintf(buf, sizeof(buf), "len=%zu",
                          strlen(path ? path : "none"));
                  fd = open("/etc/hosts", O_RDONLY);
                  if (fd >= 0) {
                          char r[16];
                          ssize_t n = read(fd, r, sizeof(r));
                          close(fd);
                          printf("fd=%d n=%zd\n", fd, n);
                  }
                  free(malloc(128));
                  printf("%s\n", buf);
                  return 0;
          }
          EOT
          ${CROSS}-gcc -O1 -o probe probe.c

          cat > conf.json <<EOT
          {"intercept_scripts": [
            {"func_name": "*",
             "actions": [
               {"action_name": "log_params"},
               {"action_name": "call_real"}]}]}
          EOT

          export RETRACE_PROBE_STR=abcd
          export RETRACE_JSON_CONFIG="$PWD/conf.json"
          export RETRACE_LOGGER_DEF_ENA=1
          export RETRACE_LOGGER_DEF_FN="$PWD/trace.log"
          export LD_PRELOAD="$PWD/build/src/v2/libretrace.so"

          out="$(${QEMU} -L /usr/${CROSS} ./probe)"
          echo "$out"
          echo "$out" | grep -q '^len=4$'
          echo "$out" | grep -q '^fd='
          # the int param must survive the big-endian slot addressing
          grep -qF '"func": "read"' trace.log
          grep -qF '"fd": "4"' trace.log
          grep -qF '"/etc/hosts"' trace.log

      - name: E2E - policy denial enforced under qemu
        run: |
          cat > deny.json <<EOT
          {"intercept_scripts": [
            {"func_name": "open",
             "actions": [
               {"action_name": "log_params"},
               {"action_name": "modify_return_value_int",
                "action_params": {"retval_int": -13}}]}]}
          EOT

          export RETRACE_JSON_CONFIG="$PWD/deny.json"
          export RETRACE_LOGGER_DEF_ENA=1
          export RETRACE_LOGGER_DEF_FN="$PWD/deny.log"
          export LD_PRELOAD="$PWD/build/src/v2/libretrace.so"

          out="$(${QEMU} -L /usr/${CROSS} ./probe)"
          echo "$out"
          # open() denied: the probe must not print its fd line
          echo "$out" | grep -q '^len=4$'
          if echo "$out" | grep -q '^fd='; then
                  echo "ERROR: open was not denied" >&2
                  exit 1
          fi
          grep -qF 'modify_return_value_int' deny.log
