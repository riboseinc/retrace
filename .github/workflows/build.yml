# Single consolidated build matrix covering all supported POSIX and Windows
# MSVC runner images. See TODO.roadmap/09-ci-cd-modernization.md.
#
# Why one workflow, not one-per-platform:
#   - Linux x64+arm64 and macOS Intel+arm64 share the same shell and the
#     same flow (cmake + ninja + ctest); only the package manager differs.
#   - Windows MSVC x64+arm64 share pwsh + vcpkg.
#   - Combining them means one concurrency group, one re-run target, one
#     place to add a new OS version.
#
# Alpine / musl lives in alpine.yml (container-based, different pkg
# manager). MSYS2 / MinGW lives in msys.yml (different shell).

name: Build

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VCPKG_REF: 4f95fba7a7d1101bb8acdeb51e4609686449701e

jobs:
  build-and-test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x86_64 ---
          - { runner: ubuntu-22.04,    platform: linux-x64   }
          - { runner: ubuntu-24.04,    platform: linux-x64   }
          - { runner: ubuntu-26.04,    platform: linux-x64,  experimental: true }
          # --- Linux ARM64 ---
          - { runner: ubuntu-22.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-26.04-arm, platform: linux-arm64, experimental: true }
          # --- macOS Intel ---
          - { runner: macos-15-intel, platform: macos-x64   }
          - { runner: macos-26-intel, platform: macos-x64,  experimental: true }
          # --- macOS Apple Silicon ---
          - { runner: macos-14,       platform: macos-arm64 }
          - { runner: macos-15,       platform: macos-arm64 }
          - { runner: macos-26,       platform: macos-arm64, experimental: true }
          # --- Windows x64 MSVC ---
          - { runner: windows-2022,    platform: windows-x64 }
          - { runner: windows-2025,    platform: windows-x64 }
          - { runner: windows-2025-vs2026, platform: windows-x64, experimental: true }
          # --- Windows ARM64 MSVC ---
          - { runner: windows-11-arm,  platform: windows-arm64 }
          - { runner: windows-11-vs2026-arm, platform: windows-arm64, experimental: true }

    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      # ----- Setup per OS family -----
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake ninja-build pkg-config valgrind

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Always bootstrap fresh — cache left vcpkg/ in a half-restored
          # state (git metadata without the binary). Bootstrap is ~1 min.
          if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          cd vcpkg
          git fetch --depth 1 origin $env:VCPKG_REF
          git checkout $env:VCPKG_REF
          .\bootstrap-vcpkg.bat -disableMetrics

      # ----- Configure -----
      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DRETRACE_BUILD_TESTS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'windows-arm64') {
            $triplet = 'arm64-windows'
          } else {
            $triplet = 'x64-windows'
          }
          $toolchain = "${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path $toolchain)) {
            throw "vcpkg toolchain not found at $toolchain"
          }
          Write-Host "Triplet: $triplet"
          Write-Host "Toolchain: $toolchain"
          # TODO.windows/04: the v2 core builds on Windows; the
          # portable unit set (logger format, trace load) runs.
          cmake -B build "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" "-DVCPKG_TARGET_TRIPLET=$triplet" "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DRETRACE_BUILD_TESTS=ON"

      # ----- Build & test (identical across OS families) -----
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }}

      # ----- ETW capture smoke (Windows; TODO.trace-profile/24) -----
      # Runners are elevated: logman + the Microsoft-Windows-Kernel-File
      # provider give the scripted kernel-truth path. Fails loudly if the
      # image ever blocks the provider (the golden test keeps the parser
      # covered regardless).
      - name: ETW capture smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "etw-smoke"
          powershell -File scripts/win/etw-capture.ps1 `
            -Target "$env:ComSpec" -TargetArgs "/c type C:\Windows\System32\drivers\etc\hosts" `
            -OutDir $out
          # Generator-dependent location (VS multi-config nests it
          # differently than Ninja/MinGW) -- find it, don't guess.
          $conv = Get-ChildItem -Path build -Recurse `
            -Filter retrace-etw2retrace.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $conv) {
            Write-Error "retrace-etw2retrace.exe not built"
          }
          & $conv -o "$out\trace.json" "$out\etw-events.jsonl"
          Write-Host "ETW smoke rows:"
          Get-Content "$out\etw-events.jsonl" | Write-Host
          # Machine truth for the Id<->task mapping (TODO 24):
          # the OS's own manifest table, printed every run.
          try {
            $prov = Get-WinEvent -ListProvider Microsoft-Windows-Kernel-File
            $prov.Tasks | Sort-Object Value |
              ForEach-Object { Write-Host ("ETW manifest: id={0} task={1}" -f $_.Value, $_.Name) }
          } catch {
            Write-Host "ETW manifest: provider table unavailable"
          }
          $trace = Get-Content "$out\trace.json" -Raw
          if (-not $trace.Contains("hosts")) {
            Write-Error "ETW smoke: no hosts read captured"
          }
          Write-Host "ETW smoke: kernel-truth capture OK"

      # ----- Static binary smoke (Windows; TODO.trace-profile/27) -----
      # The /MT target carries its own CRT -- no ucrtbase to hook.
      # File opens are only visible at the ntdll boundary, which is
      # the opt-in ntdll layer's territory. Capture through it and
      # assert the hosts read shows up with a decoded path.
      - name: Static binary smoke (Windows)
        if: runner.os == 'Windows' && matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $find = {
            param($name)
            Get-ChildItem -Path build -Recurse -Filter $name |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $profiler = & $find "retrace-profile.exe"
          $smoke = & $find "retrace-static-smoke.exe"
          $lib = & $find "retrace.dll"
          if (-not $profiler -or -not $smoke -or -not $lib) {
            Write-Error "profiler, retrace.dll or static-smoke target not built"
          }
          $env:RETRACE_V2_LIB = $lib
          $cfg = Join-Path $env:RUNNER_TEMP "static-cfg.json"
          # single line, single-quoted: no here-string, no
          # indentation semantics, no interpolation
          '{"intercept_scripts":[{"func_name":"fopen","actions":[{"action_name":"log_params"},{"action_name":"call_real"}]},{"func_name":"NtCreateFile","actions":[{"action_name":"log_params"},{"action_name":"call_real"}]},{"func_name":"NtOpenFile","actions":[{"action_name":"log_params"},{"action_name":"call_real"}]},{"func_name":"NtReadFile","actions":[{"action_name":"log_params"},{"action_name":"call_real"}]}]}' |
            Set-Content -Path $cfg -Encoding ascii
          Write-Host "static config:"
          Get-Content $cfg | Write-Host
          $env:RETRACE_WIN_DIAG = "1"   # evidence: 'we:' per wrapper entry
          $env:RETRACE_JSON_CONFIG = $cfg

          # CONTROL run: no ntdll hooks (ucrt patches only --
          # invisible to a /MT exe). If THIS crashes, the fault
          # is in injection/boot, not the ntdll layer.
          Remove-Item Env:RETRACE_WIN_NTDLL -ErrorAction SilentlyContinue
          # Start-Process: crashed runs must NOT become pwsh
          # session errors (EAP=Stop + native exit != 0)
          $ctlrun = Start-Process -FilePath $profiler `
            -ArgumentList "capture","-o","static-ctl.json","--","$smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host "control (no NTDLL) capture rc: $($ctlrun.ExitCode)"
          Write-Host "control verdict:"
          Get-Content (Join-Path $PWD "static-result.txt") -ErrorAction SilentlyContinue | Write-Host
          Remove-Item (Join-Path $PWD "static-result.txt") -ErrorAction SilentlyContinue

          # TEST run: the ntdll layer on.
          $env:RETRACE_WIN_NTDLL = "1"
          $mtrun = Start-Process -FilePath $profiler `
            -ArgumentList "capture","-o","static-profile.json","--","$smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host "test (NTDLL=1, /MT) capture rc: $($mtrun.ExitCode)"

          # HOOK-SET BISECT (TODO 27 round 4): the no-log run
          # crashed identically -- logging is innocent. Bisect the
          # 8 opt-in hooks: one CI round, one exit code each.
          $env:RETRACE_JSON_CONFIG = $cfg
          foreach ($hook in
              "NtCreateFile","NtOpenFile","NtQueryAttributesFile",
              "NtClose","LdrLoadDll","NtWriteFile","NtReadFile",
              "NtQueryDirectoryFile") {
            Remove-Item (Join-Path $PWD "static-result.txt") -ErrorAction SilentlyContinue
            $env:RETRACE_WIN_NTDLL_LIST = $hook
            $bi = Start-Process -FilePath $profiler `
              -ArgumentList "capture","-o","static-bi.json","--","$smoke" `
              -Wait -PassThru -NoNewWindow
            Write-Host ("bisect NTDLL_LIST={0} rc: {1}" -f $hook, $bi.ExitCode)
          }
          # TODO 28 discriminator: NtCreateFile alone with a
          # call_real-ONLY script (no log_params = no param
          # serialization). Pass -> serialization is the killer;
          # fail -> the trampoline return path itself.
          Remove-Item (Join-Path $PWD "static-result.txt") -ErrorAction SilentlyContinue
          $cfgnl = Join-Path $env:RUNNER_TEMP "static-cfg-nolog.json"
          '{"intercept_scripts":[{"func_name":"NtCreateFile","actions":[{"action_name":"call_real"}]},{"func_name":"NtOpenFile","actions":[{"action_name":"call_real"}]}]}' |
            Set-Content -Path $cfgnl -Encoding ascii
          # param-shape control: NtOpenFile (6 params) vs
          # NtCreateFile (11 params + OUT IO_STATUS_BLOCK)
          $env:RETRACE_WIN_NTDLL_LIST = "NtOpenFile"
          $env:RETRACE_JSON_CONFIG = $cfgnl
          $ofbi = Start-Process -FilePath $profiler `
            -ArgumentList "capture","-o","static-ofbi.json","--","$smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host ("bisect NTDLL_LIST=NtOpenFile NO-logging rc: {0}" -f $ofbi.ExitCode)
          $env:RETRACE_WIN_NTDLL_LIST = "NtCreateFile"
          $env:RETRACE_JSON_CONFIG = $cfgnl
          $nlbi = Start-Process -FilePath $profiler `
            -ArgumentList "capture","-o","static-nlbi.json","--","$smoke" `
            -Wait -PassThru -NoNewWindow
          Write-Host ("bisect NTDLL_LIST=NtCreateFile NO-logging rc: {0}" -f $nlbi.ExitCode)
          Write-Host "NtCreateFile no-log verdict:"
          Get-Content (Join-Path $PWD "static-result.txt") -ErrorAction SilentlyContinue | Write-Host
          Remove-Item (Join-Path $PWD "static-result.txt") -ErrorAction SilentlyContinue
          $env:RETRACE_JSON_CONFIG = $cfg
          Remove-Item Env:RETRACE_WIN_NTDLL_LIST -ErrorAction SilentlyContinue

          # The OS names the faulting module + offset on crash --
          # machine truth for WHERE the ntdll layer kills /MT.
          try {
            Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              ProviderName = 'Application Error'
            } -MaxEvents 1 | ForEach-Object {
              Write-Host "WER event (faulting app/module):"
              ($_.Message -split "`n" | Select-Object -First 12) |
                ForEach-Object { Write-Host "  $_" }
            }
          } catch {
            Write-Host "WER event: none found"
          }
          # evidence: the child's own verdict (stdout can vanish
          # under suspended-create injection)
          $verdict = Join-Path $PWD "static-result.txt"
          if (Test-Path $verdict) {
            Write-Host "static target verdict:"
            Get-Content $verdict | Write-Host
          } else {
            Write-Host "static target verdict: FILE MISSING"
          }
          # v2.32.0 assertion (TODO.trace-profile/28): the
          # dispatch fix (0..6 -> 0..12 args) makes the scripted
          # call_real path WORK for the ntdll file API -- the
          # FULL original assertion returns: a static-CRT
          # binary's file activity, captured with decoded paths.
          # evidence (TODO 28 round 5): the raw TRACE the child
          # wrote (capture names it in its stderr line)
          $newest = Get-ChildItem $env:TEMP -Filter "rtr*.tmp" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($newest) {
            Write-Host "raw trace ($($newest.Name)):"
            Get-Content $newest.FullName -Raw | Write-Host
          } else {
            Write-Host "raw trace: no rtr*.tmp found"
          }
          $prof = ""
          if (Test-Path static-profile.json) {
            $prof = Get-Content static-profile.json -Raw
          }
          Write-Host "static-profile (NTDLL=1, /MT):"
          Write-Host $prof
          if (-not $prof.Contains("hosts")) {
            Write-Error "static smoke: no hosts capture through the ntdll layer"
          }
          Write-Host "static smoke: ntdll-layer capture OK (static-CRT)"

      # ----- Smoke tests (POSIX only — no LD_PRELOAD on Windows) -----
      # Best-effort: skipped if the v2 library wasn't produced.
      # The CMake target is `retrace_v2` for historical reasons but the
      # output library is `libretrace.{so,dylib}` (Phase 9 / ADR-0011).
      # Uses /usr/bin/id (works on both Linux and macOS; /bin/id does
      # not exist on newer macOS).
      - name: Smoke test v2 (POSIX)
        if: runner.os != 'Windows'
        env:
          RETRACE_LOGGER_DEF_STDOUT_ENA: "0"
        run: |
          set -e
          ext="${{ runner.os == 'Linux' && 'so' || 'dylib' }}"
          lib="build/src/v2/libretrace.$ext"
          [ -f "$lib" ] || { echo "v2 library missing; skipping"; exit 0; }

          # Build a tiny non-SIP binary that calls getuid().
          cat > /tmp/smoke_getuid.c <<'EOFC'
          #include <unistd.h>
          #include <stdio.h>
          int main(void) { printf("uid=%d\n", getuid()); return 0; }
          EOFC
          cc /tmp/smoke_getuid.c -o /tmp/smoke_getuid

          if [ "${{ runner.os }}" = "Linux" ]; then
            PRELOAD_ENV="LD_PRELOAD=$(pwd)/$lib"
          else
            PRELOAD_ENV="DYLD_INSERT_LIBRARIES=$(pwd)/$lib"
          fi

          # Step 1: load — binary should still run.
          env $PRELOAD_ENV /tmp/smoke_getuid >/dev/null

          # Step 2: intercept — JSON config flips getuid() to 0; assert output.
          cat > /tmp/smoke_redirect.json <<'EOFC'
          {
            "intercept_scripts": [
              {
                "func_name": "getuid",
                "actions": [
                  { "action_name": "log_params" },
                  { "action_name": "call_real" },
                  { "action_name": "modify_return_value_int",
                    "action_params": { "retval_int": 0 } }
                ]
              }
            ]
          }
          EOFC
          out=$(env $PRELOAD_ENV RETRACE_JSON_CONFIG=/tmp/smoke_redirect.json /tmp/smoke_getuid 2>/tmp/smoke_stderr)
          echo "intercepted output: $out"
          echo "--- stderr from retrace ---"
          head -10 /tmp/smoke_stderr
          case "$out" in
            *uid=0*) echo "interception verified";;
            *) echo "ERROR: getuid() was not intercepted"; exit 1;;
          esac

  # ----- Coverage as a separate job in the same workflow -----
  # Best-effort: ctest runs runtests.sh which assumes `retrace` is in PATH.
  # Under the CMake build the binary lives at build/retrace; until runtests.sh
  # is CMake-aware (TODO.roadmap/08), the test may silently no-op and lcov
  # finds no .gcda. --ignore-errors empty keeps the job green in that case;
  # once tests actually run, real coverage flows through.
  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake ninja-build lcov
      - run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DRETRACE_ENABLE_COVERAGE=ON \
                -DRETRACE_BUILD_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure || true
      - run: lcov --directory build --capture --output-file coverage.info --ignore-errors empty || true
      - run: lcov --remove coverage.info '/usr/*' 'build/_deps/*' --output-file coverage.info || true
      - uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/coverage.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: hashFiles('coverage.info') != ''
