# Linux kernel checkpatch.pl on the diff. See TODO.roadmap/09-ci-cd-modernization.md.

name: Checkpatch

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      # Fetch full history so checkpatch can walk the base..HEAD commit range.
      # Default checkout (fetch-depth: 1) only has the merge commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up environment
        run: |
          echo CHECKPATCH_INSTALL="${HOME}/builds/checkpatch-install" >> "${GITHUB_ENV}"
          ./ci/before_install.sh
      - name: Install more prerequisites
        run: ./ci/install.sh checkpatch
      - name: Check patch
        env:
          RETRACE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./ci/checkpatch.sh
