# the collector: OTLP/HTTP on 4318 (the live streamer posts
# /v1/logs), logged to its own stdout so `docker compose logs
# otelcol` IS the live security feed
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
