# SPDX-License-Identifier: BSD-2-Clause
#
# FreeBSD CI via Cirrus. See TODO.roadmap/09-ci-cd-modernization.md.
#
# CMake build, mirroring the GHA workflows. The GHA workflows cover
# Ubuntu/Alpine/macOS/Windows; Cirrus is the canonical FreeBSD surface.

env:
  PATH: /usr/local/bin:$PATH

global_task_template: &GLOBAL_TASK_TEMPLATE
  only_if: $CIRRUS_BRANCH == 'master' || $CIRRUS_BRANCH == 'main' || $CIRRUS_BRANCH =~ 'release/.*' || $CIRRUS_PR != ''
  skip: |
    $CIRRUS_CHANGE_MESSAGE =~ '.*skip ci.*'
  setup_environment_script: |
    pkg update -f
    pkg install -y cmake ninja pkgconf openssl git bash
  configure_script:  cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRETRACE_BUILD_TESTS=ON
  build_script:      cmake --build build
  test_script:       ctest --test-dir build --output-on-failure
  smoke_v2_script:
    - RETRACE_LOGGER_DEF_STDOUT_ENA=0 LD_PRELOAD=$(pwd)/build/src/v2/libretrace_v2.so /bin/id

freebsd-13-task:
  << : *GLOBAL_TASK_TEMPLATE
  freebsd_instance:
    image_family: freebsd-13-4

freebsd-14-task:
  << : *GLOBAL_TASK_TEMPLATE
  freebsd_instance:
    image_family: freebsd-14-2
